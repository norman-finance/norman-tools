name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  SERVICE_NAME: 'tools'

jobs:
  release-production:
    runs-on: ubuntu-latest
#    needs: lint
    if: github.ref == 'refs/heads/main' && github.repository_owner == 'norman-finance'
    env:
      NODE_OPTIONS: '--max_old_space_size=8192'
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: set up qemu
        uses: docker/setup-qemu-action@v2

      - name: set up buildx
        uses: docker/setup-buildx-action@v2

      - name: generate image identifier
        id: image
        uses: ASzc/change-string-case-action@v5
        with:
          string: ${{ github.repository_owner }}

      - name: login to ghcr
        uses: docker/login-action@v2
        if: ${{ github.ref == 'refs/heads/main' }}
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: build frontend image
        uses: docker/build-push-action@v3
        with:
          context: .
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: |
            ghcr.io/${{ steps.image.outputs.lowercase }}/tools:latest
            ghcr.io/${{ steps.image.outputs.lowercase }}/tools:${{ github.sha }}
          build-args: |
            RELEASE=${{ github.sha }}
            OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}
            NEXT_PUBLIC_API_URL=https://api.norman.finance
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-production:
    needs: release-production
    if: github.ref == 'refs/heads/main' && github.repository_owner == 'norman-finance'
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: Read image identifiers
        id: image
        uses: ASzc/change-string-case-action@v5
        with:
          string: ${{ github.repository_owner }}

      - name: Update production image
        uses: appleboy/ssh-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: root
          key: ${{ secrets.SSH_KEY }}
          script: docker service update norman_tools --image ghcr.io/${{ steps.image.outputs.lowercase }}/tools:${{ github.sha }} --with-registry-auth