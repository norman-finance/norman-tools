version: '3.8'

services:
  norman-invoicing-tool:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: norman-invoicing-tool
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=https://api.norman.finance
    restart: unless-stopped
    networks:
      - norman-network

networks:
  norman-network:
    driver: bridge 